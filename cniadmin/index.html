<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNI Admin — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0D47A1 0%, #1565C0 50%, #1976D2 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-wrap img {
      height: 56px;
      object-fit: contain;
    }

    .logo-fallback {
      display: none;
      font-size: 22px;
      font-weight: 700;
      color: #1565C0;
      letter-spacing: -0.5px;
    }

    .card-title {
      text-align: center;
      font-size: 15px;
      color: #64748b;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      color: #1e293b;
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: #1565C0;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: #1565C0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.01em;
      margin-top: 8px;
    }

    .btn-login:hover { background: #0D47A1; }
    .btn-login:active { transform: scale(0.98); }

    .btn-login:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #dc2626;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }

    .error-msg.visible { display: block; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-note {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      .login-card { padding: 36px 24px 28px; margin: 16px; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-wrap">
      <img
        src="../assets/images/logo.png"
        alt="CNI Plásticos"
        onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';"
      />
      <span class="logo-fallback">CNI Plásticos</span>
    </div>

    <p class="card-title">Painel Administrativo</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn-login" id="btn-login">Entrar</button>
      <div class="error-msg" id="error-msg">Senha incorreta. Tente novamente.</div>
    </form>

    <p class="footer-note">CNI Plásticos &copy; 2025</p>
  </div>

  <script>
    // Redirect if already logged in
    if (sessionStorage.getItem('cni_admin_token')) {
      window.location.href = '/cniadmin/panel';
    }

    const form = document.getElementById('login-form');
    const btn = document.getElementById('btn-login');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value.trim();
      if (!password) return;

      errorMsg.classList.remove('visible');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Entrando...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        const data = await res.json();

        if (res.ok && data.token) {
          sessionStorage.setItem('cni_admin_token', data.token);
          window.location.href = '/cniadmin/panel';
        } else {
          errorMsg.textContent = data.error || 'Senha incorreta. Tente novamente.';
          errorMsg.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      } catch (err) {
        errorMsg.textContent = 'Erro de conexão. Verifique sua internet.';
        errorMsg.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
