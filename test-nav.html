<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body { margin: 0; height: 200vh; background: #eee; }
  .header { position: sticky; top: 0; z-index: 1000; background: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .header-container { display: flex; justify-content: space-between; }
  .nav.active { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 1000; }
  .menu-toggle { z-index: 1001; position: relative; }
</style>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="logo">Logo</div>
      <nav class="nav active"></nav>
      <button class="menu-toggle">Menu</button>
    </div>
  </header>
  <h1>Content</h1>
</body>
</html>
