<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; height: 200vh; background: #eee; }
  .header {
    position: fixed; top: 0; width: 100%; height: 80px;
    background: rgba(255,255,255,0.9);
    z-index: 100;
    /* backdrop-filter: blur(8px); */
  }
  .nav.active {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(255,0,0,0.5);
  }
</style>
</head>
<body>
  <header class="header">
    <nav class="nav active">Mobile Menu Content nested inside fixed header</nav>
  </header>
</body>
</html>
