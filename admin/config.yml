backend:
  name: github
  repo: nathancwb/cni-plasticos
  branch: main
  auth_type: pkce
  app_id: REPLACE_WITH_GITHUB_OAUTH_CLIENT_ID

media_folder: assets/images/blog
public_folder: /assets/images/blog

locale: pt

collections:
  - name: blog
    label: Blog
    label_singular: Post
    files:
      - name: posts
        label: Publicações do Blog
        file: content/blog-data.json
        format: json
        fields:
          - name: posts
            label: Posts
            widget: list
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - name: title
                label: Título
                widget: string
              - name: slug
                label: "URL do post (sem espaços, sem acentos, ex: meu-artigo)"
                widget: string
                pattern:
                  - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
                  - "Apenas letras minúsculas, números e hífens"
              - name: date
                label: Data de publicação
                widget: datetime
                format: DD MMM YYYY
                date_format: DD/MM/YYYY
                time_format: false
              - name: excerpt
                label: Resumo (aparece no card do blog)
                widget: text
              - name: thumbnail
                label: Imagem de capa
                widget: image
                required: false
              - name: content
                label: Conteúdo completo do post
                widget: markdown

  - name: settings
    label: Configurações do Site
    files:
      - name: contact
        label: Informações de Contato
        file: content/settings.json
        format: json
        fields:
          - name: phone
            label: Telefone / WhatsApp
            widget: string
          - name: email_comercial
            label: E-mail comercial
            widget: string
          - name: email_atendimento
            label: E-mail atendimento
            widget: string
          - name: address
            label: Endereço
            widget: string
          - name: instagram
            label: Link do Instagram
            widget: string
          - name: facebook
            label: Link do Facebook
            widget: string
