backend:
  name: github
  repo: nathancwb/cni-plasticos
  branch: main
  base_url: https://cni-plasticos.vercel.app
  auth_endpoint: api/auth

media_folder: assets/images/uploads
public_folder: /assets/images/uploads

locale: pt

collections:

  # ─── BLOG ───────────────────────────────────────────────────────────────────
  - name: blog
    label: "✍️ Blog"
    label_singular: Post
    folder: content/blog
    create: true
    slug: "{{slug}}"
    format: json
    fields:
      - { name: title, label: "Título do Post", widget: string }
      - { name: slug, label: "URL (sem acentos, ex: meu-post)", widget: string }
      - { name: date, label: "Data de publicação", widget: datetime, format: "DD MMM YYYY", date_format: "DD/MM/YYYY", time_format: false }
      - { name: excerpt, label: "Resumo (aparece no card)", widget: text }
      - { name: thumbnail, label: "Imagem de capa", widget: image, required: false }
      - { name: content, label: "Conteúdo completo", widget: markdown }

  # ─── PÁGINAS DO SITE ─────────────────────────────────────────────────────────
  - name: paginas
    label: "🖥️ Páginas do Site"
    files:

      - name: home
        label: "Página Inicial (Home)"
        file: content/home.json
        format: json
        fields:
          - { name: hero_titulo, label: "Título principal (Hero)", widget: string }
          - { name: hero_subtitulo, label: "Subtítulo (Hero)", widget: text }
          - { name: hero_cta_texto, label: "Texto do botão principal", widget: string }
          - { name: hero_imagem, label: "🖼️ Foto do Hero (imagem principal)", widget: image }
          - { name: sobre_titulo, label: "Título da seção Sobre", widget: string }
          - { name: sobre_texto, label: "Texto da seção Sobre", widget: text }
          - { name: sobre_imagem, label: "🖼️ Foto da seção Sobre (fábrica)", widget: image }
          - { name: numeros_anos, label: "Anos de experiência (ex: 20+)", widget: string }
          - { name: numeros_produtos, label: "Número de produtos (ex: 100+)", widget: string }
          - { name: numeros_clientes, label: "Número de clientes (ex: 500+)", widget: string }
          - { name: numeros_estados, label: "Estados atendidos (ex: 27)", widget: string }
          - { name: servico1_imagem, label: "🖼️ Foto Card Serviço 1 (Usinagem)", widget: image }
          - { name: servico2_imagem, label: "🖼️ Foto Card Serviço 2 (Polímeros)", widget: image }
          - { name: servico3_imagem, label: "🖼️ Foto Card Serviço 3 (Moldes)", widget: image }


      - name: empresa
        label: "A Empresa"
        file: content/empresa.json
        format: json
        fields:
          - { name: missao, label: "Missão", widget: text }
          - { name: visao, label: "Visão", widget: text }
          - { name: valores, label: "Valores", widget: text }
          - { name: historia_titulo, label: "Título da seção história", widget: string }
          - { name: historia_texto, label: "Texto da história", widget: text }
          - { name: foto_fabrica, label: "Foto da fábrica", widget: image, required: false }

  # ─── CONFIGURAÇÕES ────────────────────────────────────────────────────────────
  - name: settings
    label: "⚙️ Configurações do Site"
    files:
      - name: contact
        label: "Informações de Contato"
        file: content/settings.json
        format: json
        fields:
          - { name: phone, label: "Telefone / WhatsApp", widget: string }
          - { name: email_comercial, label: "E-mail comercial", widget: string }
          - { name: email_atendimento, label: "E-mail atendimento", widget: string }
          - { name: address, label: "Endereço completo", widget: string }
          - { name: instagram, label: "Link do Instagram", widget: string }
          - { name: facebook, label: "Link do Facebook", widget: string }

  # ─── CATÁLOGO DE PRODUTOS ───────────────────────────────────────────────────
  - name: catalogo_completo
    label: "📦 Catálogo de Produtos"
    files:
      - name: produtos_db
        label: "Todos os Produtos"
        file: content/produtos-data.json
        format: json
        fields:
          - name: produtos
            label: "Lista de Produtos"
            widget: list
            summary: "{{fields.name}} ({{fields.cat}})"
            fields:
              - { name: id, label: "ID (slug único, sem espaços)", widget: string }
              - { name: cat, label: "Categoria", widget: string }
              - { name: name, label: "Nome do Produto", widget: string }
              - { name: desc, label: "Descrição", widget: text }
              - name: specs
                label: "Especificações (Tabela)"
                widget: object
                fields:
                  - { name: categoria, label: "Categoria", widget: string, required: false }
                  - { name: material, label: "Material", widget: string, required: false }
                  - { name: dimensao, label: "Dimensões", widget: string, required: false }
                  - { name: codigo, label: "Códigos", widget: string, required: false }
                  - { name: pedido_minimo, label: "Pedido Mínimo", widget: string, required: false }
              - { name: img, label: "Imagem Principal", widget: image, required: false }
              - name: imgs
                label: "Imagens Adicionais"
                widget: list
                required: false
                field: { name: img, label: Imagem, widget: image }
              - { name: has3d, label: "Possui modelo 3D?", widget: boolean, required: false, default: false }
              - { name: model, label: "Arquivo 3D (.glb)", widget: file, required: false }
              - name: colors
                label: "Variações de Cor"
                widget: list
                required: false
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Nome da Cor", widget: string }
                  - { name: class, label: "Cor Visual (preto, amarelo...)", widget: string }
                  - { name: cod, label: "Código", widget: string, required: false }
                  - name: imgs
                    label: "Fotos desta cor"
                    widget: list
                    required: false
                    field: { name: img, label: Imagem, widget: image }
